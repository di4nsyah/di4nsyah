<svg width="500" height="500" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="shieldBg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#241419"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(110,112)">
    <!-- SHIELD / SQUAD EMBLEM BORDER (jagged crown top, tapered point bottom) -->
    <path d="
      M 0,-100
      L 14,-88 L 10,-76 L 32,-82 L 34,-66 L 54,-68
      C 66,-52 74,-34 76,-14
      C 78,10 70,34 54,54
      C 40,70 22,84 0,98
      C -22,84 -40,70 -54,54
      C -70,34 -78,10 -76,-14
      C -74,-34 -66,-52 -54,-68
      L -34,-66 L -32,-82 L -10,-76 L -14,-88
      Z"
      fill="url(#shieldBg)" stroke="#E60012" stroke-width="2" opacity="0.97"/>
    <path d="
      M 0,-100
      L 14,-88 L 10,-76 L 32,-82 L 34,-66 L 54,-68
      C 66,-52 74,-34 76,-14
      C 78,10 70,34 54,54
      C 40,70 22,84 0,98
      C -22,84 -40,70 -54,54
      C -70,34 -78,10 -76,-14
      C -74,-34 -66,-52 -54,-68
      L -34,-66 L -32,-82 L -10,-76 L -14,-88
      Z"
      fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.6" transform="scale(0.95)"/>

    <!-- CENTRAL WING INSIGNIA (original design, gold) -->
    <g filter="url(#glow)">
      <!-- top spike -->
      <path d="M 0,-58 C 4,-42 7,-28 6,-19 L -6,-19 C -7,-28 -4,-42 0,-58 Z" fill="#FFD700"/>

      <!-- left wing -->
      <path d="
        M -13,-22
        C -28,-30 -44,-38 -60,-48
        C -50,-32 -38,-22 -30,-14
        C -42,-13 -54,-9 -66,2
        C -50,8 -34,10 -22,6
        C -14,4 -8,4 -4,10
        C -6,20 -8,26 -12,32
        C -8,30 -3,26 -1,22
        C 0,14 -1,4 -13,-22
        Z" fill="#FFD700"/>

      <!-- bottom spike -->
      <path d="M -5,30 C -3,46 -2,62 0,74 C 2,62 3,46 5,30 Z" fill="#FFD700"/>
    </g>
    <g filter="url(#glow)" transform="scale(-1,1)">
      <path d="
        M -13,-22
        C -28,-30 -44,-38 -60,-48
        C -50,-32 -38,-22 -30,-14
        C -42,-13 -54,-9 -66,2
        C -50,8 -34,10 -22,6
        C -14,4 -8,4 -4,10
        C -6,20 -8,26 -12,32
        C -8,30 -3,26 -1,22
        C 0,14 -1,4 -13,-22
        Z" fill="#FFD700"/>
    </g>

    <!-- center hub -->
    <circle cx="0" cy="0" r="8" fill="#0d1117" stroke="#E60012" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#E60012"/>
  </g>
</svg>
