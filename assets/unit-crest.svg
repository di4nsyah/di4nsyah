<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lens" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FF5A4D"/>
      <stop offset="45%" stop-color="#E60012"/>
      <stop offset="100%" stop-color="#6B0000"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <path id="arcpath" d="M 33.4,170 A 100,100 0 0 1 206.6,170" fill="none"/>
  </defs>

  <!-- outer ring -->
  <circle cx="120" cy="120" r="112" fill="#111111" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#E60012" stroke-width="1.5" stroke-dasharray="3 7"/>

  <!-- tick marks -->
  <g stroke="#8C8C8C" stroke-width="2.2" stroke-linecap="round">
    <line x1="228" y1="120" x2="210" y2="120"/>
    <line x1="213.5" y1="174" x2="204.9" y2="169"/>
    <line x1="174" y1="213.5" x2="169" y2="204.9"/>
    <line x1="120" y1="228" x2="120" y2="210"/>
    <line x1="66" y1="213.5" x2="71" y2="204.9"/>
    <line x1="26.5" y1="174" x2="35.1" y2="169"/>
    <line x1="12" y1="120" x2="30" y2="120"/>
    <line x1="26.5" y1="66" x2="35.1" y2="71"/>
    <line x1="66" y1="26.5" x2="71" y2="35.1"/>
    <line x1="120" y1="12" x2="120" y2="30"/>
    <line x1="174" y1="26.5" x2="169" y2="35.1"/>
    <line x1="213.5" y1="66" x2="204.9" y2="71"/>
  </g>
  <g stroke="#E60012" stroke-width="3" stroke-linecap="round">
    <line x1="228" y1="120" x2="206" y2="120"/>
    <line x1="120" y1="228" x2="120" y2="206"/>
    <line x1="12" y1="120" x2="34" y2="120"/>
    <line x1="120" y1="12" x2="120" y2="34"/>
  </g>

  <!-- side wings -->
  <path d="M 2,120 L 32,102 L 32,138 Z" fill="#1A1A1A" stroke="#E60012" stroke-width="1.5"/>
  <path d="M 238,120 L 208,102 L 208,138 Z" fill="#1A1A1A" stroke="#E60012" stroke-width="1.5"/>

  <!-- hexagon frame -->
  <polygon points="175,120 147.5,167.6 92.5,167.6 65,120 92.5,72.4 147.5,72.4"
    fill="none" stroke="#C9C9C9" stroke-width="1.5" opacity="0.55"/>

  <!-- center optic / lens -->
  <circle cx="120" cy="120" r="36" fill="#0D0D0D" stroke="#4A4A4A" stroke-width="3"/>
  <circle cx="120" cy="120" r="28" fill="url(#lens)"/>
  <circle cx="108" cy="108" r="7" fill="#FFFFFF" opacity="0.45"/>
  <line x1="120" y1="92" x2="120" y2="148" stroke="#1A1A1A" stroke-width="1.5" opacity="0.5"/>
  <line x1="92" y1="120" x2="148" y2="120" stroke="#1A1A1A" stroke-width="1.5" opacity="0.5"/>

  <!-- curved label -->
  <text font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="4" fill="#E60012">
    <textPath href="#arcpath" startOffset="50%" text-anchor="middle">UNIT · SSKY</textPath>
  </text>
</svg>
