<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#2E0303"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#E60012" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#E60012" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#E60012" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="5" y2="0" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bgGrad)"/>
